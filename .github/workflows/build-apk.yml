name: Build APK

# Runs on every push to any branch. Pull requests from this repository are
# covered by that push, so there is no separate pull_request trigger — that
# would build the same commit twice and use double the Actions minutes.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          # 2>&1 matters: the Kotlin compiler writes its errors to stderr.
          ./gradlew assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # When the build fails, repeat just the compiler error lines at the very
      # end of the log and in the run's summary page. Gradle prints them
      # hundreds of lines up, where they are easy to miss.
      - name: Show what went wrong
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^(e|w): |error:|FAILURE:|FAILED$|\* What went wrong|^> ' "$RUNNER_TEMP/build.log" \
              | head -60 || echo '(no compiler error lines found — see the full log above)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: family2-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
